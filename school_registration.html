<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Registration</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="tel"], input[type="number"], input[type="submit"] {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .contact-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .contact-group input[type="tel"] {
            width: 80%;
        }

        .contact-group button {
            background-color: #ff5733;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

        .contact-group button:hover {
            background-color: #e04b29;
        }

        button[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 18px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        .contact-wrapper {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>School Registration</h1>
    <form action="{{ url_for('school_registration') }}" method="POST">
        <div class="form-group">
            <label for="school_id">School ID</label>
            <input type="number" id="school_id" name="school_id" required>
        </div>
        <div class="form-group">
            <label for="school_name">School Name</label>
            <input type="text" id="school_name" name="school_name" required>
        </div>
        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required>
        </div>

        <div class="contact-wrapper">
            <label>Contact Numbers</label>
            <div id="contact-container">
                <div class="contact-group">
                    <input type="tel" name="contact_no[]" placeholder="Enter contact number" required>
                    <button type="button" onclick="addContact()">+</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <button type="submit">Register School</button>
        </div>
    </form>
</div>

<script>
    function addContact() {
        var contactContainer = document.getElementById('contact-container');
        var newContactGroup = document.createElement('div');
        newContactGroup.classList.add('contact-group');

        var contactInput = document.createElement('input');
        contactInput.type = 'tel';
        contactInput.name = 'contact_no[]';
        contactInput.placeholder = 'Enter contact number';
        contactInput.required = true;

        var removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.textContent = '–';
        removeButton.onclick = function() {
            contactContainer.removeChild(newContactGroup);
        };

        newContactGroup.appendChild(contactInput);
        newContactGroup.appendChild(removeButton);

        contactContainer.appendChild(newContactGroup);
    }
</script>

</body>
</html>
